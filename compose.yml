services:
  mysql:
    image: mysql:8.4
    container_name: cartalaap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cartalaap}
    ports:
      - "3306:3306"
    volumes:
      - cartalaap_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  cartalaap_mysql_data:
